# Continuous integration: lint, tests, a live start of the app, then the Docker image
# started the way the server runs it (read-only, non-root, 512 MB, 1 CPU).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q --durations=5

      - name: Start the app and call the API
        env:
          DEMO_SIZE: "4000"
        run: |
          uvicorn app.main:app --port 7860 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7860/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:7860/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:7860/
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/overview
          curl -fsS -o /dev/null "http://127.0.0.1:7860/api/alerts?page_size=5"
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/evaluation

      - name: Show server log on failure
        if: failure()
        run: cat uvicorn.log || true

  docker:
    name: Docker image (server conditions)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t mutuelle-exemple-fraude:ci .

      - name: Run read-only, non-root, 512 MB, 1 CPU, custom PORT
        run: |
          docker run -d --name demo \
            --read-only --tmpfs /tmp \
            --memory 512m --cpus 1 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PORT=8080 \
            -p 127.0.0.1:8080:8080 \
            mutuelle-exemple-fraude:ci

      - name: Wait until the Docker health check reports healthy
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' demo)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            [ "$(docker inspect --format '{{.State.Running}}' demo)" = "true" ] || { docker logs demo; exit 1; }
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' demo)" = "healthy" ]

      - name: Check the API, the user and the memory use
        run: |
          curl -fsS http://127.0.0.1:8080/health
          echo
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/api/evaluation
          uid=$(docker exec demo id -u)
          echo "container uid: $uid"
          [ "$uid" != "0" ]
          docker stats --no-stream demo

      - name: Show container log on failure
        if: failure()
        run: docker logs demo || true
