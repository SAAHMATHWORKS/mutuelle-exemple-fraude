# Continuous integration: lint, tests, a live start of the app, then the Docker image
# started the way the server runs it (read-only, non-root, 512 MB, 1 CPU).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pytest
        run: |
          set -o pipefail
          # Failures are also raised as annotations, readable from the run page and the API.
          pytest -q --durations=5 -rf --tb=short 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR|E  )' pytest.log | head -40 | sed 's/^/::error title=pytest::/'
            exit 1
          }

      - name: Start the app and call the API
        env:
          DEMO_SIZE: "4000"
        run: |
          uvicorn app.main:app --port 7860 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7860/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:7860/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:7860/
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/overview
          curl -fsS -o /dev/null "http://127.0.0.1:7860/api/alerts?page_size=5"
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/evaluation
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/exploration
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/evaluation/advanced
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/providers
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/model
          curl -fsS -o /dev/null http://127.0.0.1:7860/api/explain
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"question":"Bonjour ?"}' http://127.0.0.1:7860/api/chat)" = 503

      - name: Show server log on failure
        if: failure()
        run: cat uvicorn.log || true

  docker:
    name: Docker image (server conditions)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Check the deployment files
        run: |
          shellcheck deploy/deploy.sh
          docker compose config --quiet
          # Fill the Nginx template with a throw-away certificate and let Nginx parse it.
          mkdir -p /tmp/ng
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=demo.example.com" \
            -keyout /tmp/ng/site.key -out /tmp/ng/site.pem 2>/dev/null
          sed -e 's#__DOMAIN__#demo.example.com#g' -e 's#__CERT__#/etc/ng/site.pem#' -e 's#__KEY__#/etc/ng/site.key#' \
            deploy/nginx-site.conf.template > /tmp/ng/default.conf
          docker run --rm -v /tmp/ng:/etc/ng:ro -v /tmp/ng/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.24 nginx -t

      - name: Build (includes the showcase snapshot)
        run: docker build -t mutuelle-exemple-fraude:ci .

      - name: Run like the server (read-only, non-root, no memory cap, low priority, custom PORT)
        run: |
          docker run -d --name demo \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --oom-score-adj 800 --cpu-shares 256 \
            -e PORT=8080 \
            -p 127.0.0.1:8080:8080 \
            mutuelle-exemple-fraude:ci

      - name: Wait until the Docker health check reports healthy
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' demo)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            [ "$(docker inspect --format '{{.State.Running}}' demo)" = "true" ] || { docker logs demo; exit 1; }
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' demo)" = "healthy" ]

      - name: Check the showcase mode, every view, the user and the memory use
        run: |
          curl -fsS http://127.0.0.1:8080/health | tee /tmp/health.json
          echo
          grep -q '"mode":"vitrine"' /tmp/health.json
          for path in / /api/overview "/api/alerts?page_size=20" /api/alerts/S1-00001 /api/evaluation \
                      /api/exploration /api/providers; do
            curl -fsS -o /dev/null -w "$path %{http_code} %{time_total}s\n" "http://127.0.0.1:8080$path"
          done
          # Precomputed: ready on the first call, no "computing" state for visitors.
          curl -fsS http://127.0.0.1:8080/api/evaluation/advanced | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8080/api/model | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8080/api/evaluation | grep -q '"status":"ready"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"seed": 1}' http://127.0.0.1:8080/api/regenerate)
          echo "regenerate -> $code"
          [ "$code" = "403" ]
          uid=$(docker exec demo id -u)
          echo "container uid: $uid"
          [ "$uid" != "0" ]
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' demo | awk '{print $1}')
          echo "memory: $mem"
          python3 -c "import re,sys; v,u=re.match(r'([\d.]+)(\w+)', '$mem').groups(); mib=float(v)*{'KiB':1/1024,'MiB':1,'GiB':1024}[u]; print(f'{mib:.0f} MiB'); sys.exit(0 if mib < 200 else 1)"

      - name: Show container log on failure
        if: failure()
        run: docker logs demo || true
